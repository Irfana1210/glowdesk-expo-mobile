<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RetailOS Inventory</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;family=Instrument+Serif&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#6F5B71;text-decoration:none}a:hover{color:#4E3F50}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F8F5F1; font-family: 'DM Sans', system-ui, sans-serif; color: #222024; display: flex; flex-direction: column; overflow: hidden">

<header style="padding: 60px 20px 10px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-direction: column; gap: 4px">
<p style="margin: 0; font-size: 11px; font-weight: 600; letter-spacing: 0.14em; color: #5E5A61">STOCK ON HAND</p>
<h1 style="margin: 0; font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: 38px; line-height: 1">Inventory</h1>
</div>
<div style="display: flex; gap: 8px">
<label style="flex: 1; display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 14px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E6E1DC; color: #5E5A61">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search inventory</span>
<input type="search" placeholder="Product, SKU or barcode" style="flex: 1; min-width: 0; border: none; outline: none; background: none; font-family: inherit; font-size: 14px; color: #222024">
</label>
<button type="button" aria-label="Scan a barcode" style="width: 48px; height: 48px; border-radius: 14px; border: none; background: #222024; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M7 12h10"></path></svg></button>
</div>
<div role="group" aria-label="Filter by category" style="display: flex; gap: 8px; overflow-x: auto; margin: 0 -20px; padding: 0 20px">
<sc-for list="{{ chips }}" as="chip" hint-placeholder-count="6">
<button type="button" aria-pressed="{{ chip.pressed }}" onClick="{{ chip.pick }}" style="{{ chip.style }}">{{ chip.label }}</button>
</sc-for>
</div>
</header>

<main style="flex: 1; overflow-y: auto; padding: 4px 20px 20px; display: flex; flex-direction: column; gap: 10px">
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<div style="padding: 12px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E6E1DC"><p style="margin: 0; font-size: 20px; font-weight: 600">128</p><p style="margin: 2px 0 0; font-size: 11px; color: #5E5A61">products</p></div>
<div style="padding: 12px; border-radius: 14px; background: #F6EBDD"><p style="margin: 0; font-size: 20px; font-weight: 600; color: #6E4512">3</p><p style="margin: 2px 0 0; font-size: 11px; color: #6E4512">low stock</p></div>
<div style="padding: 12px; border-radius: 14px; background: #F7E1E3"><p style="margin: 0; font-size: 20px; font-weight: 600; color: #8E2A33">1</p><p style="margin: 2px 0 0; font-size: 11px; color: #8E2A33">out of stock</p></div>
</div>

<sc-for list="{{ products }}" as="p" hint-placeholder-count="6">
<a href="#" aria-label="{{ p.aria }}" style="display: flex; align-items: center; gap: 12px; padding: 12px; background: #FFFFFF; border: 1px solid #E6E1DC; border-radius: 16px; color: #222024">
<span aria-hidden="true" style="{{ p.tileStyle }}">{{ p.mono }}</span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: #5E5A61">{{ p.brand }}</span>
<span style="font-size: 14px; font-weight: 600">{{ p.name }}</span>
<span style="font-size: 11px; color: #5E5A61">{{ p.category }} · SKU {{ p.sku }}</span>
</span>
<span style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0">
<span style="font-size: 18px; font-weight: 600">{{ p.qty }}</span>
<span style="{{ p.statusStyle }}">
<sc-if value="{{ p.isOk }}" hint-placeholder-val="{{ true }}"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4 10-10"></path></svg></sc-if>
<sc-if value="{{ p.isLow }}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 20h20z"></path><path d="M12 10v4M12 17v.5"></path></svg></sc-if>
<sc-if value="{{ p.isOut }}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 6 12 12M18 6 6 18"></path></svg></sc-if>
{{ p.status }}</span>
</span>
</a>
</sc-for>
<sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}">
<p style="margin: 24px 0; text-align: center; font-size: 14px; color: #5E5A61">No products in this category yet.</p>
</sc-if>
</main>

<nav aria-label="Main navigation" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: #FFFFFF; border-top: 1px solid #E6E1DC; padding: 6px 6px 26px">
<a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 52px; font-size: 11px; font-weight: 500; color: #6E6672"><span style="display: flex; align-items: center; justify-content: center; width: 52px; height: 30px; border-radius: 999px"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg></span>Dashboard</a>
<a href="Orders.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 52px; font-size: 11px; font-weight: 500; color: #6E6672"><span style="display: flex; align-items: center; justify-content: center; width: 52px; height: 30px; border-radius: 999px"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1 12H7z"></path><path d="M9 8V6a3 3 0 0 1 6 0v2"></path></svg></span>Orders</a>
<a href="Roster.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 52px; font-size: 11px; font-weight: 500; color: #6E6672"><span style="display: flex; align-items: center; justify-content: center; width: 52px; height: 30px; border-radius: 999px"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg></span>Roster</a>
<a href="Inventory.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 52px; font-size: 11px; font-weight: 600; color: #222024"><span style="display: flex; align-items: center; justify-content: center; width: 52px; height: 30px; border-radius: 999px; background: #EBCDD3"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5z"></path><path d="M3 7.5 12 12l9-4.5M12 12v9"></path></svg></span>Inventory</a>
<button type="button" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 52px; font-family: inherit; font-size: 11px; font-weight: 500; color: #6E6672; background: none; border: none; cursor: pointer"><span style="display: flex; align-items: center; justify-content: center; width: 52px; height: 30px; border-radius: 999px"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.2"></circle><circle cx="12" cy="12" r="1.2"></circle><circle cx="19" cy="12" r="1.2"></circle></svg></span>More</button>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { cat: 'All' };
  }
  renderVals() {
    var self = this;
    var tile = 'width: 52px; height: 52px; border-radius: 12px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-family: "Instrument Serif", Georgia, serif; font-size: 20px; color: #222024; ';
    var raw = [
      ['VELOUR', 'Soft Focus Blush · Rosewood', 'Makeup', 'VL-2210', 3, 'V', '#EAD9CF'],
      ['HEARTH & HOLLOW', 'Whipped Body Butter 200ml', 'Body Care', 'HH-1180', 0, 'H&H', '#E6E1DC'],
      ['KŌRI', 'Bond Repair Hair Oil 30ml', 'Haircare', 'KR-0555', 2, 'K', '#F2EBDD'],
      ['PETAL & PITH', 'Cloud Lip Oil · Fig', 'Makeup', 'PP-0917', 4, 'P&P', '#ECE6F0'],
      ['LUMEN SKIN', 'Dewy Barrier Cream 50ml', 'Skincare', 'LS-1042', 24, 'LS', '#F3E3E7'],
      ['MAISON IRIS', 'Fig Leaf Eau de Parfum 50ml', 'Fragrance', 'MI-0730', 11, 'MI', '#DDE3EC'],
      ['SALTWATER BOTANICA', 'Sea Mist Toner 150ml', 'Skincare', 'SW-0381', 36, 'SB', '#DCE8E4']
    ];
    var statusBase = 'display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px; ';
    var all = raw.map(function (r) {
      var out = r[4] === 0, low = !out && r[4] <= 5;
      var status = out ? 'Out of stock' : low ? 'Low stock' : 'In stock';
      return {
        brand: r[0], name: r[1], category: r[2], sku: r[3], qty: r[4], mono: r[5],
        tileStyle: tile + 'background: ' + r[6],
        isOut: out, isLow: low, isOk: !out && !low, status: status,
        statusStyle: statusBase + (out ? 'background: #F7E1E3; color: #8E2A33' : low ? 'background: #F6EBDD; color: #6E4512' : 'background: #E1EEE7; color: #2C5B4A'),
        aria: r[0] + ' ' + r[1] + ', ' + r[4] + ' on hand, ' + status
      };
    });
    var cat = this.state.cat;
    var chipBase = 'flex-shrink: 0; min-height: 40px; padding: 0 14px; border-radius: 999px; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; ';
    var chips = ['All', 'Skincare', 'Makeup', 'Fragrance', 'Haircare', 'Body Care'].map(function (c) {
      var on = cat === c;
      return {
        label: c, pressed: on ? 'true' : 'false',
        style: chipBase + (on ? 'background: #222024; color: #FFFFFF; border: 1px solid #222024' : 'background: #FFFFFF; color: #222024; border: 1px solid #E6E1DC'),
        pick: function () { self.setState({ cat: c }); }
      };
    });
    var products = cat === 'All' ? all : all.filter(function (p) { return p.category === cat; });
    return { chips: chips, products: products, empty: products.length === 0 };
  }
}
</script>
</body>
</html>
