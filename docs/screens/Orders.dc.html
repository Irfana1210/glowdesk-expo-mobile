<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RetailOS Orders</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;family=Instrument+Serif&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#6F5B71;text-decoration:none}a:hover{color:#4E3F50}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F8F5F1; font-family: 'DM Sans', system-ui, sans-serif; color: #222024; display: flex; flex-direction: column; overflow: hidden">

<header style="padding: 60px 20px 12px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: flex-end; justify-content: space-between">
<div style="display: flex; flex-direction: column; gap: 4px">
<p style="margin: 0; font-size: 11px; font-weight: 600; letter-spacing: 0.14em; color: #5E5A61">CLICK &amp; COLLECT</p>
<h1 style="margin: 0; font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: 38px; line-height: 1">Orders</h1>
</div>
<button type="button" aria-label="Search orders" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid #E6E1DC; background: #FFFFFF; color: #222024; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
</button>
</div>
<div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; background: #F7E1E3; color: #8E2A33">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
<span style="font-size: 13px; font-weight: 600">3 overdue · shown first</span>
</div>
<div role="group" aria-label="Filter by status" style="display: flex; gap: 8px; overflow-x: auto">
<sc-for list="{{ chips }}" as="chip" hint-placeholder-count="4">
<button type="button" aria-pressed="{{ chip.pressed }}" onClick="{{ chip.pick }}" style="{{ chip.style }}">{{ chip.label }} <span style="font-weight: 500; opacity: 0.75">{{ chip.count }}</span></button>
</sc-for>
</div>
</header>

<main style="flex: 1; overflow-y: auto; padding: 4px 20px 20px; display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{ orders }}" as="o" hint-placeholder-count="5">
<a href="OrderDetails.dc.html" aria-label="{{ o.aria }}" style="display: flex; flex-direction: column; gap: 12px; padding: 14px; background: #FFFFFF; border: 1px solid #E6E1DC; border-radius: 18px; color: #222024">
<div style="display: flex; align-items: center; gap: 12px">
<span style="width: 42px; height: 42px; border-radius: 999px; background: #F3EEF4; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; flex-shrink: 0">{{ o.initials }}</span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 15px; font-weight: 600">#ORD-{{ o.id }}</span>
<span style="font-size: 12px; color: #5E5A61">{{ o.items }} · placed {{ o.time }}</span>
</span>
<span style="{{ o.badgeStyle }}">
<sc-if value="{{ o.isReady }}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4 10-10"></path></svg></sc-if>
<sc-if value="{{ o.isPicking }}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1 12H7z"></path></svg></sc-if>
<sc-if value="{{ o.isNew }}" hint-placeholder-val="{{ true }}"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg></sc-if>
{{ o.statusLabel }}</span>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 10px; border-top: 1px solid #F0EBE6">
<span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #5E5A61">
<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>{{ o.assignee }}</span>
<span style="{{ o.dueStyle }}">
<svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>{{ o.due }}</span>
</div>
</a>
</sc-for>
<sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}">
<p style="margin: 24px 0; text-align: center; font-size: 14px; color: #5E5A61">No orders with this status.</p>
</sc-if>
</main>

<nav aria-label="Main navigation" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: #FFFFFF; border-top: 1px solid #E6E1DC; padding: 6px 6px 26px">
<a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 52px; font-size: 11px; font-weight: 500; color: #6E6672"><span style="display: flex; align-items: center; justify-content: center; width: 52px; height: 30px; border-radius: 999px"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg></span>Dashboard</a>
<a href="Orders.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 52px; font-size: 11px; font-weight: 600; color: #222024"><span style="display: flex; align-items: center; justify-content: center; width: 52px; height: 30px; border-radius: 999px; background: #EBCDD3"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1 12H7z"></path><path d="M9 8V6a3 3 0 0 1 6 0v2"></path></svg></span>Orders</a>
<a href="Roster.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 52px; font-size: 11px; font-weight: 500; color: #6E6672"><span style="display: flex; align-items: center; justify-content: center; width: 52px; height: 30px; border-radius: 999px"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg></span>Roster</a>
<a href="Inventory.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 52px; font-size: 11px; font-weight: 500; color: #6E6672"><span style="display: flex; align-items: center; justify-content: center; width: 52px; height: 30px; border-radius: 999px"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5z"></path><path d="M3 7.5 12 12l9-4.5M12 12v9"></path></svg></span>Inventory</a>
<button type="button" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 52px; font-family: inherit; font-size: 11px; font-weight: 500; color: #6E6672; background: none; border: none; cursor: pointer"><span style="display: flex; align-items: center; justify-content: center; width: 52px; height: 30px; border-radius: 999px"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.2"></circle><circle cx="12" cy="12" r="1.2"></circle><circle cx="19" cy="12" r="1.2"></circle></svg></span>More</button>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 'ALL' };
  }
  renderVals() {
    var self = this;
    var data = [
      ['7841','J.L.',5,'1:47 pm','PICKING','Jordan Lee (you)','Overdue 53 min',true],
      ['7845','F.A.',2,'2:05 pm','PICKING','Grace Liu','Overdue 35 min',true],
      ['7846','C.D.',3,'2:21 pm','NEW','Unassigned','Overdue 19 min',true],
      ['7843','P.M.',2,'2:44 pm','PICKING','Leo Martin','Due 4:44 pm',false],
      ['7844','B.S.',3,'3:10 pm','PICKING','Grace Liu','Due 5:10 pm',false],
      ['7842','K.O.',1,'3:35 pm','PICKING','Leo Martin','Due 5:35 pm',false],
      ['7852','S.C.',3,'4:31 pm','NEW','Unassigned','Due 6:31 pm',false],
      ['7851','M.K.',2,'4:18 pm','NEW','Unassigned','Due 6:18 pm',false],
      ['7850','H.B.',1,'4:02 pm','NEW','Unassigned','Due 6:02 pm',false],
      ['7849','O.R.',4,'3:44 pm','NEW','Unassigned','Due 5:44 pm',false],
      ['7848','T.N.',2,'3:20 pm','NEW','Unassigned','Due 5:20 pm',false],
      ['7847','L.W.',1,'2:58 pm','NEW','Unassigned','Due 4:58 pm',false],
      ['7840','R.W.',4,'12:55 pm','READY','Packed by Aisha Rahman','Waiting 3h',false],
      ['7838','A.P.',2,'11:02 am','READY','Packed by Aisha Rahman','Waiting 5h',false],
      ['7837','D.N.',1,'10:41 am','READY','Packed by Tom Becker','Waiting 5h',false],
      ['7835','E.T.',3,'yesterday','READY','Packed by Priya Sharma','Waiting 1 day',false],
      ['7833','G.H.',2,'yesterday','READY','Packed by Priya Sharma','Waiting 1 day',false]
    ];
    var labels = { NEW: 'New', PICKING: 'Picking', READY: 'Ready' };
    var badge = 'display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; ';
    var badgeColors = { NEW: 'background: #F3E3E7; color: #7E3343', PICKING: 'background: #ECE6F0; color: #4F3E55', READY: 'background: #E1EEE7; color: #2C5B4A' };
    var dueBase = 'display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; ';
    var all = data.map(function (d) {
      return {
        id: d[0], initials: d[1], items: d[2] + (d[2] === 1 ? ' item' : ' items'), time: d[3], status: d[4],
        statusLabel: labels[d[4]], assignee: d[5], due: d[6],
        isNew: d[4] === 'NEW', isPicking: d[4] === 'PICKING', isReady: d[4] === 'READY',
        badgeStyle: badge + badgeColors[d[4]],
        dueStyle: dueBase + (d[7] ? 'color: #A8323C' : 'color: #5E5A61'),
        aria: 'Order ' + d[0] + ', ' + labels[d[4]] + ', ' + d[6] + ', ' + d[5]
      };
    });
    var counts = { ALL: all.length, NEW: 0, PICKING: 0, READY: 0 };
    all.forEach(function (o) { counts[o.status] += 1; });
    var filter = this.state.filter;
    var chipBase = 'flex-shrink: 0; min-height: 40px; padding: 0 14px; border-radius: 999px; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; ';
    var chips = [['ALL','All'],['NEW','New'],['PICKING','Picking'],['READY','Ready']].map(function (c) {
      var on = filter === c[0];
      return {
        label: c[1], count: counts[c[0]], pressed: on ? 'true' : 'false',
        style: chipBase + (on ? 'background: #222024; color: #FFFFFF; border: 1px solid #222024' : 'background: #FFFFFF; color: #222024; border: 1px solid #E6E1DC'),
        pick: function () { self.setState({ filter: c[0] }); }
      };
    });
    var orders = filter === 'ALL' ? all : all.filter(function (o) { return o.status === filter; });
    return { chips: chips, orders: orders, empty: orders.length === 0 };
  }
}
</script>
</body>
</html>
